--threads:on
--parallelBuild:0

-d:worldFloat

@if release or danger:
  # nim c -d:release  (or -d:danger for the stripped-down variant)
  # nothing extra needed -- -d:release/-d:danger already do the work
@elif profile:
  # nim c -d:profile
  -d:memProfiler
  --profiler:on
  --stackTrace:on
@else:
  # plain `nim c` with no -d: flags -- the default/debug profile
  -d:debug
  --stackTrace:on
@end

--path:"$config/src/algorithms"
--path:"$config/src/application"
--path:"$config/src/basics"
--path:"$config/src/document"
--path:"$config/src/editor"
--path:"$config/src/renderer"
--path:"$config/src/sdl"
--path:"$config/src/ui"

--outdir:"$config/bin"
--define:projectDirCompiled="$config"