<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <linearGradient id="g_exit" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="62" y2="62">
    <stop offset="0" stop-color="#C97B72"/>
    <stop offset="1" stop-color="#9C433B"/>
  </linearGradient>
  <rect x="2" y="2" width="60" height="60" rx="7" fill="url(#g_exit)"/>
  <path d="M9 3.3 H55" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M9 60.7 H55" stroke="#000000" stroke-opacity="0.18" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="2" y="2" width="60" height="60" rx="7" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="1.2"/>
  
    <!-- Door body: white@0.45 pre-blended over red badge mid #b5635a → #d6a9a4 -->
    <path d="M16 14 h16 v36 h-16 a1.5 1.5 0 0 1 -3 -3 V17 a1.5 1.5 0 0 1 3 -3z" fill="#d6a9a4"/>
    <!-- Door outline -->
    <rect x="16" y="14" width="16" height="36" rx="0.8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Door panels: full white (thin stroke provides subtlety, no opacity needed) -->
    <rect x="18.5" y="16.5" width="11" height="12" rx="0.6" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="18.5" y="31.5" width="11" height="16" rx="0.6" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Doorknob -->
    <circle cx="29" cy="28" r="1.8" fill="#ffffff"/>
    <!-- Exit arrow -->
    <line x1="26" y1="32" x2="49" y2="32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M41 23 L50 32 L41 41" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
</svg>