<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <linearGradient id="g_placement" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="62" y2="62">
    <stop offset="0" stop-color="#6E9CC4"/>
    <stop offset="1" stop-color="#3B6693"/>
  </linearGradient>
  <g transform="translate(32,32) scale(1.0) translate(-32,-32)">
  <rect x="2" y="2" width="60" height="60" rx="7" fill="url(#g_placement)"/>
  <path d="M9 3.3 H55" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M9 60.7 H55" stroke="#000000" stroke-opacity="0.18" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="2" y="2" width="60" height="60" rx="7" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="1.2"/>
  
    <!-- Block 1: left, already placed -->
    <polygon points="13,40 22,35 31,40 22,45" fill="#ffffff"/>
    <polygon points="13,40 22,45 22,52 13,47" fill="#d0dde9"/>
    <polygon points="31,40 22,45 22,52 31,47" fill="#9eb8d1"/>
    <!-- Block 2: right, already placed -->
    <polygon points="31,40 40,35 49,40 40,45" fill="#ffffff"/>
    <polygon points="31,40 40,45 40,52 31,47" fill="#d0dde9"/>
    <polygon points="49,40 40,45 40,52 49,47" fill="#9eb8d1"/>
    <!-- Target slot: dashed outline where block 3 will land on top of block 2 -->
    <polygon points="31,29 40,24 49,29 40,34" fill="none" stroke="#d0dde9" stroke-width="1.4" stroke-dasharray="2.5 2"/>
    <!-- Block 3: hovering above target slot, being placed -->
    <polygon points="31,16 40,11 49,16 40,21" fill="#ffffff"/>
    <polygon points="31,16 40,21 40,28 31,23" fill="#d0dde9"/>
    <polygon points="49,16 40,21 40,28 49,23" fill="#9eb8d1"/>
    <!-- Downward arrow -->
    <line x1="40" y1="28" x2="40" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M37 30 L40 33 L43 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>
</svg>